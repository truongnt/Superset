<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
.row {
  display: flex;
  gap: 8px;
  padding: 4px;
}
.card {
  flex: 1;
  background: #fff;
  border: 0.5px solid #e0e0e0;
  border-radius: 8px;
  padding: 14px 16px;
  text-align: center;
}
.label {
  margin: 0 0 8px;
  font-size: 12px;
  color: #666;
}
.total {
  margin: 0 0 4px;
  font-size: 32px;
  font-weight: 500;
  color: #111;
}
.compare {
  margin: 0;
  font-size: 11px;
  color: #888;
}
</style>

<div class="row">
  <div class="card">
    <p class="label">Tổng ca SXH</p>
    <p class="total" id="tong-ca">{{tong_ca}}</p>
  </div>
  <div class="card">
    <p class="label">Tử vong</p>
    <p class="total" id="tu-vong" style="color:#E24B4A">{{tu_vong}}</p>
  </div>
  <div class="card">
    <p class="label">Đang điều trị</p>
    <p class="total" id="dang-dt">{{dang_dieu_tri}}</p>
  </div>
  <div class="card">
    <p class="label">Tỷ lệ tử vong</p>
    <p class="total" id="ty-le-tv" style="color:#E24B4A">0%</p>
    <p class="compare" style="color:#888">trên tổng ca</p>
  </div>
</div>

<script>
function val(id) {
  var el = document.getElementById(id);
  if (!el) return 0;
  var v = el.textContent.trim().replace('%', '');
  if (v === '' || v === 'None' || v === 'null') return 0;
  // Superset render số theo định dạng có dấu chấm phân cách hàng nghìn
  // (vd "69.756") - phải bỏ dấu chấm đó trước khi parseFloat, nếu không
  // "69.756" bị đọc nhầm thành số thập phân 69.756 (sai lệch 1000 lần).
  if (/^\d{1,3}(\.\d{3})+$/.test(v)) {
    v = v.replace(/\./g, '');
  } else if (/^\d{1,3}(\.\d{3})+,\d+$/.test(v)) {
    v = v.replace(/\./g, '').replace(',', '.');
  }
  var n = parseFloat(v);
  return isNaN(n) ? 0 : n;
}

var tong = val('tong-ca');
var tv = val('tu-vong');
var tyLe = tong > 0 ? (tv / tong * 100).toFixed(2) : 0;
var tyLeEl = document.getElementById('ty-le-tv');
if (tyLeEl) tyLeEl.textContent = tyLe + '%';
</script>
