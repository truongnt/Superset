<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
.row {
  display: flex;
  gap: 8px;
  padding: 4px;
}
.card {
  flex: 1;
  background: #fff;
  border: 0.5px solid #e0e0e0;
  border-radius: 8px;
  padding: 14px 16px;
  text-align: center;
}
.label {
  margin: 0 0 8px;
  font-size: 12px;
  color: #666;
}
.total {
  margin: 0 0 4px;
  font-size: 32px;
  font-weight: 500;
  color: #111;
}
.compare {
  margin: 0;
  font-size: 11px;
  color: #888;
}
.yoy {
  margin-top: 4px;
  font-size: 12px;
  font-weight: 600;
  min-height: 16px;
}
.yoy.up { color: #d03b3b; }
.yoy.down { color: #0ca30c; }
.yoy.flat { color: #888; }
.scope-note {
  margin: 4px 8px 0;
  font-size: 11px;
  color: #999;
  text-align: right;
}
</style>

<div class="row">
  <div class="card">
    <p class="label">Tổng ca SXH</p>
    <p class="total" id="tong-ca">0</p>
    <p class="yoy" id="yoy-ca"></p>
  </div>
  <div class="card">
    <p class="label">Tử vong</p>
    <p class="total" id="tu-vong" style="color:#E24B4A">0</p>
    <p class="yoy" id="yoy-chet"></p>
  </div>
  <div class="card">
    <p class="label">Đang điều trị</p>
    <p class="total" id="dang-dt">0</p>
    <p class="compare" style="color:#888">trên tổng ca (YTD)</p>
  </div>
  <div class="card">
    <p class="label">Tỷ lệ tử vong</p>
    <p class="total" id="ty-le-tv" style="color:#E24B4A">0%</p>
    <p class="compare" style="color:#888">trên tổng ca (YTD)</p>
  </div>
</div>
<p class="scope-note" id="scope-note"></p>

<script>
(function () {
  // ── Tên cột dataset — nguồn: vw_sxh_danh_sach_ca ─────────────────────────────
  var COL_THANG = 'ngay_khoi_phat';
  var COL_MAC   = 'tong_ca';
  var COL_CHET  = 'tu_vong';
  var COL_DANGDT = 'dang_dieu_tri';
  // ─────────────────────────────────────────────────────────────────────────────

  var data = window.__chartData || window.DATA || [];
  var fmt = function (n) { return (+n || 0).toLocaleString('vi-VN'); };

  function num(r, key) {
    return +(r[key] || r['SUM__' + key] || r['COUNT__' + key] || 0);
  }
  function toMs(v) {
    if (v == null) return null;
    var n = +v;
    if (!isNaN(n) && n > 1e10) return n;
    var d = new Date(v);
    return isNaN(d.getTime()) ? null : d.getTime();
  }

  var nowMs = Date.now();
  var now = new Date(nowMs);
  var curYear = now.getFullYear();
  var curMonth = now.getMonth() + 1;
  var priorYear = curYear - 1;

  // Lũy kế từ đầu năm đến hết tháng hiện tại (YTD), so với CÙNG SỐ THÁNG của
  // năm trước — không dùng bộ lọc "Thời gian" của dashboard (widget này luôn
  // tự tính đủ lịch sử để so sánh cùng kỳ, giống cách đường cong dịch tễ tự
  // quản lý phạm vi năm của nó). "Đang điều trị" dùng CÙNG khung thời gian
  // YTD với "Tổng ca" (không lấy toàn thời gian nữa) để 2 số cùng 1 chart
  // luôn so sánh được với nhau — lưu ý bản thân trường "đang điều trị" là
  // trạng thái ghi nhận lần cuối, không phải số đang nằm viện thực tế.
  var cur = { mac: 0, chet: 0, dangDt: 0 };
  var prior = { mac: 0, chet: 0 };

  data.forEach(function (r) {
    var ts = toMs(r[COL_THANG]);
    if (ts == null || ts > nowMs) return; // bỏ dữ liệu rác/ngày tương lai
    var d = new Date(ts);
    var y = d.getFullYear(), m = d.getMonth() + 1;
    if (y === curYear && m <= curMonth) {
      cur.mac += num(r, COL_MAC); cur.chet += num(r, COL_CHET); cur.dangDt += num(r, COL_DANGDT);
    } else if (y === priorYear && m <= curMonth) {
      prior.mac += num(r, COL_MAC); prior.chet += num(r, COL_CHET);
    }
  });

  document.getElementById('tong-ca').textContent = fmt(cur.mac);
  document.getElementById('tu-vong').textContent = fmt(cur.chet);
  document.getElementById('dang-dt').textContent = fmt(cur.dangDt);
  var tyLe = cur.mac > 0 ? (cur.chet / cur.mac * 100) : 0;
  document.getElementById('ty-le-tv').textContent = tyLe.toFixed(3) + '%';

  function renderYoy(elId, curVal, priorVal) {
    var el = document.getElementById(elId);
    if (!el || priorVal <= 0) return;
    var pct = (curVal - priorVal) / priorVal * 100;
    var arrow = pct > 0.5 ? '▲' : (pct < -0.5 ? '▼' : '►');
    var cls = pct > 0.5 ? 'up' : (pct < -0.5 ? 'down' : 'flat');
    el.className = 'yoy ' + cls;
    el.textContent = arrow + ' ' + (pct >= 0 ? '+' : '') + pct.toFixed(1) + '% so với cùng kỳ ' + priorYear;
  }
  renderYoy('yoy-ca', cur.mac, prior.mac);
  renderYoy('yoy-chet', cur.chet, prior.chet);

  document.getElementById('scope-note').textContent =
    '📅 Lũy kế từ đầu năm đến hết tháng ' + curMonth + '/' + curYear + ' (không theo bộ lọc "Thời gian")';
})();
</script>
